<!-- Ensure this meta tag is in your <head> to prevent mobile browsers from zooming out -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
	html,
	body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		background-color: #0d0d11;
		color: #e0e0e0;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		overflow: hidden;
		display: flex;
		align-items: center;
		justify-content: center;
		user-select: none;
		-webkit-user-select: none;
	}

	#viewport-container {
		width: 100%;
		height: 100%;
		display: flex;
		align-items: center;
		justify-content: center;
		position: relative;
	}

	/* Scales the SDL canvas to fit screen while retaining original aspect ratio */
	canvas.emscripten {
		border: 0px none;
		background-color: #000000;
		outline: none;
		max-width: 100%;
		max-height: 100%;
		object-fit: contain;
		box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
		/* Use 'pixelated' for low-res pixel art; omit for smooth vector rendering */
		/* image-rendering: pixelated; */
	}

	/* Minimalist Loading Overlay */
	#loader {
		position: absolute;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		pointer-events: none;
		transition: opacity 0.3s ease;
	}

	.spinner {
		width: 36px;
		height: 36px;
		border: 3px solid rgba(255, 255, 255, 0.1);
		border-top-color: #4f46e5;
		border-radius: 50%;
		animation: spin 0.8s linear infinite;
	}

	@keyframes spin {
		to {
			transform: rotate(360deg);
		}
	}

	#status {
		margin-top: 14px;
		font-size: 13px;
		letter-spacing: 0.5px;
		color: #9ca3af;
	}

	/* Fullscreen Button Styles */
	#fullscreen-btn {
		position: absolute;
		bottom: 20px;
		right: 20px;
		width: 44px;
		height: 44px;
		background: rgba(255, 255, 255, 0.1);
		border: 1px solid rgba(255, 255, 255, 0.2);
		border-radius: 8px;
		color: white;
		font-size: 20px;
		cursor: pointer;
		z-index: 100;
		display: flex;
		align-items: center;
		justify-content: center;
		transition: background 0.2s ease, transform 0.2s ease;
		backdrop-filter: blur(4px);
		-webkit-backdrop-filter: blur(4px);
	}

	#fullscreen-btn:hover {
		background: rgba(255, 255, 255, 0.2);
		transform: scale(1.05);
	}

	#fullscreen-btn:active {
		transform: scale(0.95);
	}

	/* Optional: Hide button when natively fullscreen */
	:fullscreen #fullscreen-btn {
		opacity: 0.3;
	}

	:fullscreen #fullscreen-btn:hover {
		opacity: 1;
	}
</style>

<div id="viewport-container">
	<!-- Right-click default menu disabled to keep mouse capture clean -->
	<canvas class="emscripten" id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

	<!-- Fullscreen Toggle Button -->
	<button id="fullscreen-btn" title="Toggle Fullscreen">
		<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
			stroke-linecap="round" stroke-linejoin="round">
			<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
		</svg>
	</button>

	<div id="loader">
		<div class="spinner" id="spinner"></div>
		<div id="status">Initializing...</div>
	</div>
</div>

<script type="text/javascript">
	var statusElement = document.getElementById('status');
	var loaderElement = document.getElementById('loader');

	var Module = {
		print: function (text) {
			if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
			console.log(text);
		},
		printErr: function (text) {
			if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
			console.error(text);
		},
		canvas: (function () {
			var canvas = document.getElementById('canvas');

			// Automatically give focus on click so SDL captures keyboard events right away
			window.addEventListener('click', function () {canvas.focus();});

			// Block browser scrolling when pressing space or arrow keys
			window.addEventListener('keydown', function (e) {
				if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
					e.preventDefault();
				}
			}, false);

			return canvas;
		})(),
		setStatus: function (text) {
			if (!Module.setStatus.last) Module.setStatus.last = {time: Date.now(), text: ''};
			if (text === Module.setStatus.last.text) return;

			var now = Date.now();
			if (now - Module.setStatus.last.time < 30) return; // Limit updates to avoid UI stutter
			Module.setStatus.last.time = now;
			Module.setStatus.last.text = text;

			if (text) {
				statusElement.innerHTML = text;
			} else {
				loaderElement.style.opacity = '0';
				setTimeout(function () {loaderElement.style.display = 'none';}, 300);
			}
		},
		totalDependencies: 0,
		monitorRunDependencies: function (left) {
			this.totalDependencies = Math.max(this.totalDependencies, left);
			Module.setStatus(left ? 'Loading asset packages... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
		}
	};

	Module.setStatus('Downloading runtime...');

	// Focus canvas as soon as window loads
	window.addEventListener('load', function () {
		document.getElementById('canvas').focus();
	});

	// --- FULLSCREEN LOGIC ---
	document.getElementById('fullscreen-btn').addEventListener('click', function () {
		var doc = window.document;
		var docEl = doc.documentElement;

		// Check if we are currently in fullscreen
		var requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
		var cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

		if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
			// Enter Fullscreen
			if (requestFullScreen) {
				requestFullScreen.call(docEl);
			}

			// Try to automatically lock orientation to landscape on mobile devices
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(function (err) {
					console.log("Orientation lock failed/unsupported:", err);
				});
			}
		} else {
			// Exit Fullscreen
			if (cancelFullScreen) {
				cancelFullScreen.call(doc);
			}

			// Unlock orientation
			if (screen.orientation && screen.orientation.unlock) {
				screen.orientation.unlock();
			}
		}
	});

</script>
